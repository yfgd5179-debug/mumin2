name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  butunluk:
    name: Depo bütünlüğü
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yerel bağlantılar + çeviri anahtarları
        run: python scripts/denetle.py

      - name: Yayındaki dosyalar erişilebilir mi?
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          fail=0
          for p in / /dil.html /404.html /robots.txt /sitemap.xml /styles.css /script.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$p")
            echo "  $p -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit $fail

  lighthouse:
    name: Lighthouse denetimi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Statik sunucu başlat
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2

      - name: Sabit Chrome kur
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "140"

      - name: Chrome yolunu tüm adımlara aktar
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Varyant sayfaları oluştur
        run: |
          printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LH kontrol</title></head><body><h1>Kontrol sayfasi</h1><p>Duz metin icerik.</p></body></html>' > _lh_test.html
          sed 's#<script src="script.js"></script>##' index.html > _v1.html
          sed 's#</head>#<style>.reveal,.stats div{opacity:1!important;transform:none!important}</style></head>#' index.html > _v2.html
          sed 's#</head>#<style>*{filter:none!important;backdrop-filter:none!important}</style></head>#' index.html > _v3.html
          sed 's#</head>#<style>*{animation:none!important;transition:none!important}</style></head>#' index.html > _v4.html
          sed 's#<link rel="stylesheet" href="styles.css">##' index.html > _v5.html
          ls -l _lh_test.html _v1.html _v2.html _v3.html _v4.html _v5.html

      # Her varyant kendi adımında koşar: ilki patlasa da diğerleri çalışır
      - name: "T1 kontrol"
        id: t1
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_lh_test.html

      - name: "V1 script yok"
        id: v1
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_v1.html

      - name: "V2 reveal kapali"
        id: v2
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_v2.html

      - name: "V3 filtre yok"
        id: v3
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_v3.html

      - name: "V4 animasyon yok"
        id: v4
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_v4.html

      - name: "V5 css yok"
        id: v5
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_v5.html

      - name: "P1 index"
        id: p1
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/index.html

      - name: "VARYANT SONUCLARI"
        run: |
          echo "T1 kontrol   : ${{ steps.t1.outcome }}"
          echo "V1 script yok: ${{ steps.v1.outcome }}"
          echo "V2 reveal yok: ${{ steps.v2.outcome }}"
          echo "V3 filtre yok: ${{ steps.v3.outcome }}"
          echo "V4 anim yok  : ${{ steps.v4.outcome }}"
          echo "V5 css yok   : ${{ steps.v5.outcome }}"
          echo "P1 index     : ${{ steps.p1.outcome }}"
