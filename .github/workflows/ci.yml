name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  butunluk:
    name: Depo bütünlüğü
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yerel bağlantılar + çeviri anahtarları
        run: python scripts/denetle.py

      - name: Yayındaki dosyalar erişilebilir mi?
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          fail=0
          for p in / /dil.html /404.html /robots.txt /sitemap.xml /styles.css /script.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$p")
            echo "  $p -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit $fail

  lighthouse:
    name: Lighthouse denetimi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Statik sunucu başlat
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2

      - name: Sabit Chrome kur
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "140"

      - name: Chrome yolunu tüm adımlara aktar
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Varyant sayfaları oluştur
        run: |
          printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LH kontrol</title></head><body><h1>Kontrol sayfasi</h1><p>Duz metin icerik.</p></body></html>' > _lh_test.html
          echo "--- dosya turu ---"
          file index.html dil.html 404.html _lh_test.html
          echo "--- ilk 32 bayt (index) ---"
          head -c 32 index.html | od -c | head -3
          # W1: tum <script> bloklari silindi (JSON-LD, satir ici scriptler, script.js)
          sed '/<script/,/<\/script>/d' index.html > _w1.html
          # W2: favicon data-URI silindi
          sed '/rel="icon"/d' index.html > _w2.html
          # W3: sadece index <head> + basit govde
          { echo '<!doctype html><html lang="tr" dir="ltr">'; sed -n '/<head>/,/<\/head>/p' index.html; echo '<body><h1>Kontrol</h1></body></html>'; } > _w3.html
          # W4: basit head + index <govde>
          { echo '<!doctype html><html lang="tr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontrol</title></head>'; sed -n '/<body/,/<\/body>/p' index.html; echo '</html>'; } > _w4.html
          ls -l _lh_test.html _w1.html _w2.html _w3.html _w4.html index.html

      # Her varyant kendi adımında koşar: ilki patlasa da diğerleri çalışır
      - name: "T1 kontrol"
        id: t1
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_lh_test.html

      - name: "W1 scriptsiz"
        id: w1
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_w1.html

      - name: "W2 faviconsiz"
        id: w2
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_w2.html

      - name: "W3 sadece head"
        id: w3
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_w3.html

      - name: "W4 sadece govde"
        id: w4
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/_w4.html

      - name: "P1 index"
        id: p1
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:8080/index.html

      - name: "VARYANT SONUCLARI"
        run: |
          echo "T1 kontrol    : ${{ steps.t1.outcome }}"
          echo "W1 scriptsiz  : ${{ steps.w1.outcome }}"
          echo "W2 faviconsiz : ${{ steps.w2.outcome }}"
          echo "W3 sadece head: ${{ steps.w3.outcome }}"
          echo "W4 sadece govde: ${{ steps.w4.outcome }}"
          echo "P1 index      : ${{ steps.p1.outcome }}"
