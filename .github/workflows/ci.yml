name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  butunluk:
    name: Depo bütünlüğü
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Yerel bağlantılar + çeviri anahtarları
        run: python scripts/denetle.py

      - name: Yayındaki dosyalar erişilebilir mi?
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          fail=0
          for p in / /dil.html /404.html /robots.txt /sitemap.xml /styles.css /script.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$p")
            echo "  $p -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit $fail

  lighthouse:
    name: Lighthouse denetimi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Statik sunucu başlat
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2

      # Chrome sürümü sabitlenir: Lighthouse 12.6 + sistem Chrome (155) NO_FCP hatası veriyor.
      - name: Sabit Chrome kur
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: "140"

      - name: Chrome sürümü
        run: "${{ steps.chrome.outputs.chrome-path }} --version"

      # Lighthouse'ın bu ortamda gerçekten çalıştığını doğrulamak için düz bir örnek sayfa
      - name: Örnek sağlık sayfası oluştur
        run: printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LH saglik kontrolu</title></head><body><h1>Lighthouse saglik kontrolu</h1><p>Duz metin icerik.</p></body></html>' > _lh_test.html && ls -l _lh_test.html

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
