<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081826"/>
      <stop offset="1" stop-color="#050d15"/>
    </linearGradient>
    <radialGradient id="l-glow" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".3"/>
