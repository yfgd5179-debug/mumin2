  <rect x="488" y="112" width="234" height="452" rx="22" fill="#f43f5e" fill-opacity=".08"/>
  <rect x="560" y="86" width="90" height="14" rx="7" fill="#f43f5e" opacity=".7"/>

  <!-- ekran: tehis listesi -->
